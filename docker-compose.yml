services:
  dashboard:
    build: .
    restart: unless-stopped
    # Run as the host user so the bind-mounted ./data stays writable.
    # If `id -u` is not 1000, export DASH_UID/DASH_GID before `docker compose up`.
    user: "${DASH_UID:-1000}:${DASH_GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite DB and family photos across restarts
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
